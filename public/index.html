<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="page-title">Catálogo</title>
  <link rel="stylesheet" href="/css/styles.css?v=20260603o" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <script src="/js/pwa.js" defer></script>
</head>
<body class="catalog-page">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-brand">
        <strong id="topbar-brand-name">Catálogo</strong>
        <span class="topbar-sub" id="user-info">…</span>
      </div>

      <div class="topbar-search">
        <input
          type="search"
          id="search"
          placeholder="Buscar producto..."
          autocomplete="off"
        />
      </div>

      <!-- Nombre del usuario actual (después del buscador, antes de los botones primarios) -->
      <span id="topbar-user" class="topbar-user" title=""></span>

      <!-- Botones primarios de acción -->
      <div class="topbar-actions topbar-actions-primary">
        <button id="venta-btn" class="btn btn-primary" hidden type="button">🧾 Venta</button>
        <button id="cart-btn" class="btn btn-ghost" type="button">
          🛒 Carrito <span id="cart-count" class="badge">0</span>
          <span id="cart-total-top" class="cart-total-top" hidden>$0</span>
        </button>
      </div>

      <!-- Menú hamburguesa (☰) al final del topbar.
           Click en el botón despliega el menú; click afuera o ESC lo cierra. -->
      <div class="topbar-menu-wrap topbar-actions-secondary">
        <button id="topbar-menu-btn" class="topbar-menu-btn" type="button"
                aria-label="Menú" aria-expanded="false" aria-haspopup="true">
          <span class="topbar-menu-icon" aria-hidden="true">☰</span>
          <span class="topbar-menu-label">Menú</span>
        </button>
        <div id="topbar-menu" class="topbar-menu" hidden role="menu">
          <!-- Nombre del usuario al inicio del menú (visible siempre, útil
               en mobile donde el chip del topbar se oculta por espacio) -->
          <div class="topbar-menu-user" id="topbar-menu-user">
            <span class="topbar-menu-user-icon">👤</span>
            <span class="topbar-menu-user-name" id="topbar-menu-user-name"></span>
          </div>
          <label id="level-switcher" class="level-switcher topbar-menu-item" hidden>
            <span class="topbar-menu-item-label">Ver como</span>
            <select id="level-select" class="level-select" aria-label="Ver lista de precios como">
              <option value="1">Minorista</option>
              <option value="2">Revendedor</option>
              <option value="3">Mayorista</option>
              <option value="4">VIP</option>
            </select>
          </label>
          <a id="admin-link" class="topbar-menu-item" href="/admin" hidden role="menuitem">
            <span class="topbar-menu-item-icon">⚙️</span> Admin
          </a>
          <button id="price-changes-btn" class="topbar-menu-item" type="button" hidden role="menuitem">
            <span class="topbar-menu-item-icon">📊</span> Ver cambios
          </button>
          <button id="orders-btn" class="topbar-menu-item" type="button" role="menuitem">
            <span class="topbar-menu-item-icon">📋</span> Mis pedidos
          </button>
          <button id="earnings-btn" class="topbar-menu-item" type="button" hidden role="menuitem">
            <span class="topbar-menu-item-icon">💰</span> Mis ganancias
          </button>
          <button id="logout-btn" class="topbar-menu-item topbar-menu-item-danger" type="button" role="menuitem">
            <span class="topbar-menu-item-icon">🚪</span> Salir
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Barra de cliente activo (solo visible para vendedores, gestionada desde app.js) -->
  <div id="vendedor-bar" class="vendedor-bar" hidden></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-mobile-head">
      <h3>Categorías</h3>
      <button class="sidebar-close" id="sidebar-close" type="button" aria-label="Cerrar">✕</button>
    </div>
    <h2 class="sidebar-title">Categorías</h2>
    <ul class="cat-list" id="cat-list">
      <li><button class="cat-btn active" data-cat="all">Todas</button></li>
    </ul>
  </aside>

  <main class="catalog">
    <button id="cat-toggle-btn" class="cat-toggle-btn" type="button" aria-label="Abrir categorías">
      <span class="cat-toggle-icon" aria-hidden="true">☰</span>
      <span class="cat-toggle-label">Categoría:</span>
      <span id="cat-toggle-current" class="cat-toggle-current">Todas</span>
      <span class="cat-toggle-chevron" aria-hidden="true">›</span>
    </button>
    <div class="catalog-info">
      <span id="result-count">Cargando productos…</span>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>No se encontraron productos.</div>
  </main>

  <!-- Fondo oscuro detras de los drawers (carrito / pedidos) -->
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>

  <!-- Drawer cambios de precio (ultima actualizacion) -->
  <aside class="drawer drawer-wide" id="price-changes-drawer" hidden>
    <header class="drawer-head">
      <button class="drawer-back" id="pc-back" type="button" aria-label="Volver">←</button>
      <h3 id="pc-title">Ver cambios</h3>
      <button class="btn btn-ghost" id="pc-close" type="button">Cerrar</button>
    </header>
    <div class="drawer-body" id="pc-body">
      <p class="muted">Cargando…</p>
    </div>
  </aside>

  <!-- Drawer ganancias del vendedor -->
  <aside class="drawer drawer-wide" id="earnings-drawer" hidden>
    <header class="drawer-head">
      <button class="drawer-back" id="earnings-back" type="button" aria-label="Volver">←</button>
      <h3>Mis ganancias</h3>
      <button class="btn btn-ghost" id="earnings-close" type="button">Cerrar</button>
    </header>
    <div class="drawer-body" id="earnings-body">
      <p class="muted">Cargando…</p>
    </div>
  </aside>

  <!-- Drawer historial de pedidos -->
  <aside class="drawer drawer-wide" id="orders-drawer" hidden>
    <header class="drawer-head">
      <button class="drawer-back" id="orders-back" type="button" aria-label="Volver">←</button>
      <h3 id="orders-title">Mis pedidos</h3>
      <button class="btn btn-ghost" id="orders-close" type="button">Cerrar</button>
    </header>
    <div class="drawer-body" id="orders-body">
      <p class="muted">Cargando…</p>
    </div>
  </aside>

  <!-- Drawer carrito -->
  <aside class="drawer" id="cart-drawer" hidden>
    <header class="drawer-head">
      <button class="drawer-back" id="cart-back" type="button" aria-label="Volver">←</button>
      <h3>Tu pedido</h3>
      <button class="btn btn-ghost" id="cart-close" type="button">Cerrar</button>
    </header>
    <div class="drawer-body" id="cart-body">
      <p class="muted">Tu carrito está vacío.</p>
    </div>
    <footer class="drawer-foot">
      <div class="cart-total">
        Total: <strong id="cart-total">$0</strong>
      </div>
      <div class="cart-notes-wrap">
        <label for="cart-notes">Nota para el pedido <span class="muted">(opcional)</span></label>
        <textarea id="cart-notes" rows="2" placeholder="Ej: entregar el martes, color especial…"></textarea>
      </div>
      <button class="btn btn-primary" id="cart-send" type="button" disabled>
        Enviar pedido por WhatsApp 📲
      </button>
    </footer>
  </aside>

  <!-- Drawer de selección de cliente (solo vendedores) -->
  <aside class="drawer drawer-wide" id="client-drawer" hidden>
    <header class="drawer-head">
      <button class="drawer-back" id="client-back" type="button" aria-label="Volver">←</button>
      <h3>Seleccionar cliente</h3>
      <button class="btn btn-ghost" id="client-close" type="button">Cerrar</button>
    </header>
    <div class="drawer-body" id="client-body">
      <p class="muted">Cargando...</p>
    </div>
  </aside>

  <!-- Modal de detalle de producto (se abre al hacer doble click / doble tap
       sobre una card del catálogo). Muestra imagen grande + datos completos
       + precio de la lista del cliente actual. Se cierra con la X o con ESC. -->
  <div id="product-modal" class="product-modal" hidden role="dialog" aria-modal="true" aria-labelledby="pm-name">
    <div class="product-modal-card">
      <button class="product-modal-close" id="pm-close" type="button" aria-label="Cerrar">✕</button>
      <div class="product-modal-img" id="pm-img"></div>
      <div class="product-modal-body">
        <div class="product-modal-cat" id="pm-cat"></div>
        <h3 class="product-modal-name" id="pm-name"></h3>
        <div class="product-modal-code" id="pm-code"></div>
        <div class="product-modal-desc" id="pm-desc"></div>
        <div class="product-modal-stock" id="pm-stock"></div>
        <div class="product-modal-foot">
          <div class="product-modal-price" id="pm-price"></div>
          <div class="product-modal-actions" id="pm-actions"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- El módulo de presupuestos (Venta) vive en su propia página /ventas
       (ver public/ventas.html + public/js/ventas.js). El botón "🧾 Venta"
       lo abre como modal flotante embebido (iframe) sobre el catálogo. -->
  <div id="ventas-modal" class="ventas-modal" hidden>
    <div class="ventas-modal-panel">
      <button type="button" id="ventas-modal-close" class="ventas-modal-x" title="Cerrar" aria-label="Cerrar">✕</button>
      <iframe id="ventas-modal-frame" class="ventas-modal-frame" title="Ventas y presupuestos" src="about:blank"></iframe>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="/js/offline.js"></script>
  <script src="/js/app.js?v=20260603a"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="page-title">Catálogo</title>
  <link rel="stylesheet" href="/css/styles.css" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Maxaria" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script src="/js/pwa.js" defer></script>
</head>
<body class="catalog-page">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-brand">
        <strong id="topbar-brand-name">Catálogo</strong>
        <span class="topbar-sub" id="user-info">…</span>
      </div>

      <div class="topbar-search">
        <input
          type="search"
          id="search"
          placeholder="Buscar producto..."
          autocomplete="off"
        />
      </div>

      <div class="topbar-actions">
        <a id="admin-link" class="btn btn-ghost" href="/admin" hidden>Admin</a>
        <label id="level-switcher" class="level-switcher" hidden>
          Ver como:
          <select id="level-select" class="level-select" aria-label="Ver lista de precios como">
            <option value="1">Minorista</option>
            <option value="2">Revendedor</option>
            <option value="3">Mayorista</option>
            <option value="4">VIP</option>
          </select>
        </label>
        <button id="price-changes-btn" class="btn btn-ghost" type="button" hidden>Ver cambios</button>
        <button id="orders-btn" class="btn btn-ghost" type="button">Mis pedidos</button>
        <button id="cart-btn" class="btn btn-ghost" type="button">
          Carrito <span id="cart-count" class="badge">0</span>
          <span id="cart-total-top" class="cart-total-top" hidden>$0</span>
        </button>
        <button id="logout-btn" class="btn btn-ghost" type="button">Salir</button>
      </div>
    </div>
  </header>

  <!-- Barra de cliente activo (solo visible para vendedores, gestionada desde app.js) -->
  <div id="vendedor-bar" class="vendedor-bar" hidden></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-mobile-head">
      <h3>Categorías</h3>
      <button class="sidebar-close" id="sidebar-close" type="button" aria-label="Cerrar">✕</button>
    </div>
    <h2 class="sidebar-title">Categorías</h2>
    <ul class="cat-list" id="cat-list">
      <li><button class="cat-btn active" data-cat="all">Todas</button></li>
    </ul>
  </aside>

  <main class="catalog">
    <button id="cat-toggle-btn" class="cat-toggle-btn" type="button" aria-label="Abrir categorías">
      <span class="cat-toggle-icon" aria-hidden="true">☰</span>
      <span class="cat-toggle-label">Categoría:</span>
      <span id="cat-toggle-current" class="cat-toggle-current">Todas</span>
      <span class="cat-toggle-chevron" aria-hidden="true">›</span>
    </button>
    <div class="catalog-info">
      <span id="result-count">Cargando productos…</span>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>No se encontraron productos.</div>
  </main>

  <!-- Fondo oscuro detras de los drawers (carrito / pedidos) -->
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>

  <!-- Drawer cambios de precio (ultima actualizacion) -->
  <aside class="drawer drawer-wide" id="price-changes-drawer" hidden>
    <header class="drawer-head">
      <button class="drawer-back" id="pc-back" type="button" aria-label="Volver">←</button>
      <h3 id="pc-title">Ver cambios</h3>
      <button class="btn btn-ghost" id="pc-close" type="button">Cerrar</button>
    </header>
    <div class="drawer-body" id="pc-body">
      <p class="muted">Cargando…</p>
    </div>
  </aside>

  <!-- Drawer historial de pedidos -->
  <aside class="drawer drawer-wide" id="orders-drawer" hidden>
    <header class="drawer-head">
      <button class="drawer-back" id="orders-back" type="button" aria-label="Volver">←</button>
      <h3 id="orders-title">Mis pedidos</h3>
      <button class="btn btn-ghost" id="orders-close" type="button">Cerrar</button>
    </header>
    <div class="drawer-body" id="orders-body">
      <p class="muted">Cargando…</p>
    </div>
  </aside>

  <!-- Drawer carrito -->
  <aside class="drawer" id="cart-drawer" hidden>
    <header class="drawer-head">
      <button class="drawer-back" id="cart-back" type="button" aria-label="Volver">←</button>
      <h3>Tu pedido</h3>
      <button class="btn btn-ghost" id="cart-close" type="button">Cerrar</button>
    </header>
    <div class="drawer-body" id="cart-body">
      <p class="muted">Tu carrito está vacío.</p>
    </div>
    <footer class="drawer-foot">
      <div class="cart-total">
        Total: <strong id="cart-total">$0</strong>
      </div>
      <div class="cart-notes-wrap">
        <label for="cart-notes">Nota para el pedido <span class="muted">(opcional)</span></label>
        <textarea id="cart-notes" rows="2" placeholder="Ej: entregar el martes, color especial…"></textarea>
      </div>
      <button class="btn btn-primary" id="cart-send" type="button" disabled>
        Enviar pedido por WhatsApp 📲
      </button>
    </footer>
  </aside>

  <!-- Drawer de selección de cliente (solo vendedores) -->
  <aside class="drawer drawer-wide" id="client-drawer" hidden>
    <header class="drawer-head">
      <button class="drawer-back" id="client-back" type="button" aria-label="Volver">←</button>
      <h3>Seleccionar cliente</h3>
      <button class="btn btn-ghost" id="client-close" type="button">Cerrar</button>
    </header>
    <div class="drawer-body" id="client-body">
      <p class="muted">Cargando...</p>
    </div>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>

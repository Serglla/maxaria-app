<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="page-title">Iniciar sesión</title>
  <link rel="stylesheet" href="/css/styles.css" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Maxaria" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script src="/js/pwa.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">
      <h1 id="login-brand-name">Catálogo</h1>
      <p>Catálogo mayorista y minorista</p>
    </div>

    <form id="login-form" class="login-form" autocomplete="on" novalidate>
      <label>
        <span>Usuario</span>
        <input type="text" name="username" required autocomplete="username" />
      </label>
      <label>
        <span>Contraseña</span>
        <input type="password" name="password" required autocomplete="current-password" />
      </label>

      <button type="submit" class="btn btn-primary" id="login-btn">Ingresar</button>

      <p id="login-error" class="login-error" hidden></p>
    </form>

    <p class="login-help">
      ¿No tenés usuario? Pedile uno al administrador.
    </p>
  </main>

  <script>
    // Cargar nombre de la app desde la API pública y actualizar la UI
    fetch("/api/app-info")
      .then((r) => r.json())
      .then((d) => {
        if (d && d.app_name) {
          document.getElementById("login-brand-name").textContent = d.app_name;
          document.getElementById("page-title").textContent = d.app_name + " · Iniciar sesión";
        }
      })
      .catch(() => {});

    const form = document.getElementById("login-form");
    const btn = document.getElementById("login-btn");
    const err = document.getElementById("login-error");

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      err.hidden = true;
      btn.disabled = true;
      btn.textContent = "Ingresando...";

      const data = Object.fromEntries(new FormData(form).entries());
      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          err.textContent = body.error || "No se pudo iniciar sesión";
          err.hidden = false;
          return;
        }
        location.href = "/catalogo";
      } catch (e) {
        err.textContent = "Error de conexión";
        err.hidden = false;
      } finally {
        btn.disabled = false;
        btn.textContent = "Ingresar";
      }
    });
  </script>
</body>
</html>

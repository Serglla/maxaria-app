<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="page-title">Iniciar sesión</title>
  <link rel="stylesheet" href="/css/styles.css" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="theme-color" content="#1e3a5f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Maxaria" />
  <script src="/js/pwa.js?v=20260804a" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">
      <h1 id="login-brand-name">Catálogo</h1>
      <p>Catálogo mayorista y minorista</p>
    </div>

    <form id="login-form" class="login-form" autocomplete="on" novalidate>
      <label>
        <span>Usuario</span>
        <input type="text" name="username" required autocomplete="username" />
      </label>
      <label>
        <span>Contraseña</span>
        <input type="password" name="password" required autocomplete="current-password" />
      </label>

      <button type="submit" class="btn btn-primary" id="login-btn">Ingresar</button>

      <p id="login-error" class="login-error" hidden></p>
    </form>

    <p class="login-help">
      ¿No tenés usuario? Pedile uno al administrador.
    </p>
  </main>

  <script src="/js/login.js?v=20260922a"></script>
</body>
</html>
